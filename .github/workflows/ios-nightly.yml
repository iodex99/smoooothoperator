# macOS build of the blind-authored iOS layer + simulator boot smoke test.
# Runs nightly, on manual dispatch, and on pushes to the 'ios-build' branch
# (push `main:ios-build` to request a cycle — workflow_dispatch is not
# available to Codespace tokens). macOS minutes bill at 10× on private
# repos: batch fixes, don't spam pushes.
name: iOS nightly build

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
  push:
    branches: [ios-build]

jobs:
  ios-build:
    name: xcodegen + xcodebuild + simulator smoke
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: |
          # No secrets in CI: an empty config means the app builds and runs
          # fully offline, which is exactly what the screenshot tour needs.
          cp App/Configs/Supabase.example.xcconfig App/Configs/Supabase.xcconfig
          cd App && xcodegen generate

      # Prefer a simulator whose native resolution IS an App Store
      # screenshot size, so the captures need no resampling.
      #
      #   1284x2778 (6.7") = 428x926pt @3x -> 14 Plus / 13 Pro Max / 12 Pro Max
      #   1242x2688 (6.5") = 414x896pt @3x -> 11 Pro Max / XS Max
      #
      # This used to take whichever iPhone the runner listed first, which
      # was an iPhone 16 Pro: 1206x2622, a size App Store Connect accepts
      # at no slot at all. tools/store-screenshots.py can rescale to an
      # exact size afterwards, but rescaling upsamples and softens text, so
      # capturing at the real size is strictly better when it is available.
      - name: Pick a simulator
        id: sim
        run: |
          read -r UDID NAME < <(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          preferred = ['iPhone 14 Plus', 'iPhone 13 Pro Max', 'iPhone 12 Pro Max',
                       'iPhone 11 Pro Max', 'iPhone XS Max']
          devices = [d for runtime in json.load(sys.stdin)['devices'].values()
                     for d in runtime if d['name'].startswith('iPhone')]
          pick = next((d for name in preferred
                         for d in devices if d['name'] == name), devices[0])
          print(pick['udid'], pick['name'])
          ")
          echo "Capturing on: $NAME"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true

      # A real iPhone is arm64 with the device SDK; the simulator is a
      # different architecture and a different SDK. Code can compile for one
      # and not the other — an availability guard, a simulator-only stub, a
      # framework that ships no device slice. Everything here has only ever
      # been built for the simulator, so that whole class of error is sitting
      # unexamined between us and the first real drive.
      #
      # Signing is off, so this needs no Apple account, no certificate and no
      # secret. It proves the app COMPILES for a phone, which is the part
      # that can be proven for free.
      - name: Build for a real device (unsigned)
        run: |
          cd App && xcodebuild build \
            -project SmoooothOperator.xcodeproj \
            -scheme SmoooothOperator \
            -destination "generic/platform=iOS" \
            -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Build for iOS Simulator
        run: |
          cd App && xcodebuild build \
            -project SmoooothOperator.xcodeproj \
            -scheme SmoooothOperator \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Demo tour — capture the whole app
        run: |
          APP=$(find App/build/Build/Products -name "*.app" -maxdepth 2 | head -1)
          xcrun simctl install "${{ steps.sim.outputs.udid }}" "$APP"
          mkdir -p shots
          # Onboarding walk: six screens, auto-advancing every 4s.
          #
          # NO SLEEP HERE, DELIBERATELY. `simctl io screenshot` takes about
          # two seconds by itself, so `sleep 2` produced a ~4s cadence that
          # aliased exactly with the 4s advance — the capture landed on the
          # same phase of every screen and skipped whole ones. The 2026-08-20
          # run lost the safety gate entirely, which is the single screen App
          # Review most wants to see.
          #
          # THE CAPTURE ITSELF SLOWS THE APP DOWN. `simctl io screenshot`
          # stalls the simulator while it works, so hammering it with no
          # pause starves the timer driving the onboarding walk: run
          # 32345700041 asked for a fixed 8s per page and got advances at
          # 7s, 10s and then 25s, each gap longer than the last as the
          # pressure accumulated, and the walk never reached pages 5 or 6.
          #
          # Doubling the frame count did not help and could not have — the
          # walk was not being outrun, it was being throttled. `sleep 1`
          # gives the simulator room to actually run the app between shots,
          # which is why the tour (which sleeps 2) never had this problem.
          #
          # ~2s per frame, a ~48s walk, 64 frames: every page caught several
          # times with the loop still running well past the end.
          for i in $(seq -w 1 64); do
            sleep 1
            xcrun simctl io "${{ steps.sim.outputs.udid }}" screenshot "shots/onboard-$i.png" || true
          done
          xcrun simctl terminate "${{ steps.sim.outputs.udid }}" app.smooooth.operator || true
          # Scripted tour: tabs, course map, then a full mock drive (with the
          # drive follow-cam map) to the result screen.
          SIMCTL_CHILD_SMOOOOTH_DEMO_TOUR=1 xcrun simctl launch "${{ steps.sim.outputs.udid }}" app.smooooth.operator
          # ~3s per frame with the sleep. The tour now runs ~176s, so 90
          # frames rather than 60 — the old count ended while the tour was
          # still going, which is why its last stages showed enormous dwells.
          for i in $(seq -w 1 90); do
            sleep 2
            xcrun simctl io "${{ steps.sim.outputs.udid }}" screenshot "shots/tour-$i.png" || true
          done

      - name: Upload screenshot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshots
          path: shots/
          if-no-files-found: ignore

      # The raw tour is a contact sheet, not a deliverable: 71 files, 19 of
      # them distinct, five showing signed-out or error states because CI
      # has no backend. This turns it into the ten frames worth uploading,
      # ordered, at the exact pixel sizes App Store Connect accepts.
      - name: Build App Store screenshot sets
        if: always()
        run: |
          python3 -m pip install --quiet --break-system-packages Pillow \
            || python3 -m pip install --quiet Pillow
          python3 tools/store-screenshots.py shots store-screenshots

      - name: Upload App Store screenshot sets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-store-screenshots
          path: store-screenshots/
          if-no-files-found: ignore
