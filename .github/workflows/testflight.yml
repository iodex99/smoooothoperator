# Build the app on a Mac we rent by the minute, sign it, and hand it to
# TestFlight — so getting Smooooth Operator onto a real iPhone needs no Mac.
#
# WHY THIS EXISTS: publishing to the App Store is NOT required to install on
# a phone, and it is not even the fastest route. TestFlight installs a real,
# signed build on a real device, and for INTERNAL testers (you, and up to 99
# others on your App Store Connect team) Apple does not review it first — the
# build appears minutes after processing finishes.
#
# Deliberately manual. A Mac runner costs about ten times a Linux one, and
# every upload consumes a build number, so this runs when you press the
# button and not on every push.
#
# ── WHAT YOU HAVE TO CREATE FIRST ────────────────────────────────────────
#
# 1. An Apple Developer Program membership, and an app record in App Store
#    Connect whose bundle ID is exactly:  app.smooooth.operator
#
# 2. An App Store Connect API key: Users and Access → Integrations → App
#    Store Connect API → generate a key with the "App Manager" role. Apple
#    lets you download the .p8 file ONCE, so save it somewhere safe.
#
# 3. Six repository secrets — Settings → Secrets and variables → Actions:
#
#      APPLE_TEAM_ID          ten characters, e.g. A1B2C3D4E5
#      APPSTORE_KEY_ID        ten characters, from the key you generated
#      APPSTORE_ISSUER_ID     a UUID, shown above the key list
#      APPSTORE_PRIVATE_KEY   the ENTIRE .p8 file, including the
#                             -----BEGIN PRIVATE KEY----- lines
#      SUPABASE_URL           https://<ref>.supabase.co
#      SUPABASE_ANON_KEY      the publishable/anon key
#
#    The last two are NOT secrets in the security sense — the anon key ships
#    inside the binary and row-level security is what protects data — but
#    they are secrets here because without them the build produces an app
#    that installs, launches, and cannot reach the backend at all. A tester
#    would see an app that simply does not work, with nothing to explain it.
#
# The API key is what lets this sign without anyone hand-managing
# certificates: `-allowProvisioningUpdates` asks Apple to create and fetch
# whatever certificate and profile the build needs.
#
# ── HONEST CAVEAT ────────────────────────────────────────────────────────
#
# This workflow has never run. It cannot be tested without a paid Apple
# account, and there is no way to fake one. The shape is standard and the
# steps are ordinary, but expect the first run to need a small correction —
# most likely the `method` value in the export options, which Apple renamed
# from `app-store` to `app-store-connect` in Xcode 15.3. Both are noted
# below. If it fails, send me the log and it will be a quick fix.

name: TestFlight

on:
  workflow_dispatch:
    inputs:
      notes:
        description: "What changed in this build (shown to testers)"
        required: false
        default: "Internal test build"

jobs:
  upload:
    name: archive, sign, upload
    runs-on: macos-26   # Xcode 26.x — App Store Connect rejects anything built with an older SDK
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      # Fail with a sentence a person can act on, rather than a signing error
      # forty lines into xcodebuild.
      - name: Check the secrets exist
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          missing=""
          [ -n "$TEAM_ID" ]     || missing="$missing APPLE_TEAM_ID"
          [ -n "$KEY_ID" ]      || missing="$missing APPSTORE_KEY_ID"
          [ -n "$ISSUER_ID" ]   || missing="$missing APPSTORE_ISSUER_ID"
          [ -n "$PRIVATE_KEY" ] || missing="$missing APPSTORE_PRIVATE_KEY"
          [ -n "$SUPABASE_URL" ]      || missing="$missing SUPABASE_URL"
          [ -n "$SUPABASE_ANON_KEY" ] || missing="$missing SUPABASE_ANON_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo "Add them under Settings → Secrets and variables → Actions."
            echo "The header of .github/workflows/testflight.yml says where each one comes from."
            exit 1
          fi

      # WITHOUT THIS THE BUILD SHIPS AN APP THAT CANNOT REACH THE BACKEND.
      # project.yml reads SUPABASE_URL and SUPABASE_ANON_KEY from this
      # xcconfig, which is gitignored because it is per-developer. The
      # nightly job copies the EXAMPLE file — placeholder values are fine
      # there, because that job only proves the code compiles. A TestFlight
      # build goes on a real phone, and a placeholder URL means sign-in,
      # courses, leaderboards and uploads all fail silently on a device that
      # otherwise looks fine.
      - name: Write the Supabase configuration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # The `/$()/` is not a typo: xcconfig treats `//` as a comment, so
          # the empty variable reference breaks up the `https://` scheme.
          # Without it the value silently truncates to `https:`.
          printf 'SUPABASE_URL = %s\nSUPABASE_ANON_KEY = %s\n' \
            "$(printf '%s' "$SUPABASE_URL" | sed 's|//|/$()/|')" \
            "$SUPABASE_ANON_KEY" > App/Configs/Supabase.xcconfig
          echo "wrote App/Configs/Supabase.xcconfig"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: cd App && xcodegen generate

      - name: Write the App Store Connect API key
        env:
          PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
        run: |
          KEY_PATH=~/private_keys/AuthKey_${KEY_ID}.p8
          mkdir -p ~/private_keys
          printf '%s\n' "$PRIVATE_KEY" > "$KEY_PATH"

          # A .p8 pasted into a GitHub secret routinely loses its line breaks, and
          # sometimes only the base64 body gets copied without the dashed header and
          # footer. Either way it is still the right key but no longer valid PEM, and
          # xcodebuild rejects it with CryptoKitASN1Error.invalidPEMDocument twenty
          # minutes into the archive. Rebuild canonical PEM from whatever arrived.
          python3 - "$KEY_PATH" <<'NORMALISE'
          import re, sys
          p = sys.argv[1]
          raw = open(p).read()
          m = re.search(r"-----BEGIN ([A-Z ]+)-----", raw)
          label = m.group(1) if m else "PRIVATE KEY"
          body = re.sub(r"-----(BEGIN|END)[A-Z ]*-----", "", raw)
          body = re.sub(r"\s+", "", body)
          if not body:
              sys.exit("APPSTORE_PRIVATE_KEY is empty.")
          wrapped = "\n".join(body[i:i + 64] for i in range(0, len(body), 64))
          open(p, "w").write(
              "-----BEGIN %s-----\n%s\n-----END %s-----\n" % (label, wrapped, label)
          )
          NORMALISE

          # Fail here, in seconds, rather than after a full archive.
          if ! openssl pkey -in "$KEY_PATH" -noout 2>/dev/null; then
            echo "::error::APPSTORE_PRIVATE_KEY is not a usable private key. Paste the entire contents of the AuthKey_<KEY_ID>.p8 downloaded from App Store Connect -> Users and Access -> Integrations, and check it is that key rather than the Sign in with Apple one."
            exit 1
          fi
          echo "App Store Connect API key parsed cleanly."
          chmod 600 "$KEY_PATH"

      - name: Verify the App Store Connect credentials
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          # The 401 that xcodebuild reports for listTeams is opaque and arrives after
          # a long checkout. Mint an App Store Connect JWT from the same three secrets
          # and call the API directly, so a mismatched key, key ID, or issuer ID is
          # named here in about a second.
          python3 - <<'PREFLIGHT'
          import base64, json, os, subprocess, sys, time, urllib.error, urllib.request

          key_path = os.path.expanduser("~/private_keys/AuthKey_%s.p8" % os.environ["KEY_ID"])

          def b64(raw):
              return base64.urlsafe_b64encode(raw).rstrip(b"=")

          def der_to_p1363(der):
              # SEQUENCE { INTEGER r, INTEGER s } -> r||s, 32 bytes each
              if der[0] != 0x30:
                  sys.exit("openssl did not return a DER signature")
              i = 4 if der[1] & 0x80 else 2
              out = b""
              for _ in range(2):
                  if der[i] != 0x02:
                      sys.exit("malformed DER signature")
                  length = der[i + 1]
                  out += der[i + 2:i + 2 + length].lstrip(b"\x00").rjust(32, b"\x00")
                  i += 2 + length
              return out

          now = int(time.time())
          header = {"alg": "ES256", "kid": os.environ["KEY_ID"], "typ": "JWT"}
          claims = {
              "iss": os.environ["ISSUER_ID"],
              "iat": now,
              "exp": now + 300,
              "aud": "appstoreconnect-v1",
          }
          signing_input = b".".join(
              b64(json.dumps(x, separators=(",", ":")).encode()) for x in (header, claims)
          )
          der = subprocess.run(
              ["openssl", "dgst", "-sha256", "-sign", key_path],
              input=signing_input, capture_output=True,
          ).stdout
          token = (signing_input + b"." + b64(der_to_p1363(der))).decode()

          req = urllib.request.Request(
              "https://api.appstoreconnect.apple.com/v1/apps?limit=200",
              headers={"Authorization": "Bearer " + token},
          )
          try:
              apps = json.load(urllib.request.urlopen(req, timeout=30))["data"]
          except urllib.error.HTTPError as e:
              print("::error::App Store Connect rejected these credentials (HTTP %d). The "
                    "private key, APPSTORE_KEY_ID and APPSTORE_ISSUER_ID must all come from "
                    "the same key under Users and Access -> Integrations -> App Store "
                    "Connect API. A Sign in with Apple key will not work here." % e.code)
              sys.exit(1)

          bundle_ids = [a["attributes"]["bundleId"] for a in apps]
          print("Credentials accepted. Visible apps: %s" % ", ".join(sorted(bundle_ids)))
          if "app.smooooth.operator" not in bundle_ids:
              print("::error::These credentials work but cannot see app.smooooth.operator. "
                    "Give the key the App Manager role, or check the bundle ID.")
              sys.exit(1)
          PREFLIGHT

      # TestFlight refuses a build number it has already seen for a given
      # version. The run number only ever increases, which is the whole
      # requirement.
      - name: Archive
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          cd App && xcodebuild archive \
            -project SmoooothOperator.xcodeproj \
            -scheme SmoooothOperator \
            -destination "generic/platform=iOS" \
            -archivePath "$PWD/build/SmoooothOperator.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${KEY_ID}.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO
          # Archiving unsigned is deliberate. With automatic signing
          # xcodebuild resolves a *development* profile for the archive,
          # which requires a registered device and is useless for
          # TestFlight anyway. The export step below signs the app for
          # real, with a distribution profile it creates on demand.

      - name: Write export options
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # `app-store-connect` is the Xcode 15.3+ name. On an older Xcode
          # this must read `app-store` instead — that is the single most
          # likely thing to need changing on a first run.
          cat > App/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST

      - name: Export and upload to TestFlight
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          cd App && xcodebuild -exportArchive \
            -archivePath "$PWD/build/SmoooothOperator.xcarchive" \
            -exportPath "$PWD/build/export" \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${KEY_ID}.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

      - name: What happens next
        run: |
          echo "Uploaded build ${{ github.run_number }}."
          echo
          echo "Apple now processes it, which usually takes 5-30 minutes."
          echo "When it finishes:"
          echo "  1. App Store Connect -> TestFlight -> add yourself as an Internal Tester"
          echo "  2. Install TestFlight from the App Store on your iPhone"
          echo "  3. Sign in with the same Apple ID -- the build is waiting there"
          echo
          echo "Internal builds are NOT reviewed by Apple first."
          echo
          echo "Then: go and drive a real road. That is the only thing left"
          echo "that no amount of work in this repository can answer."

      # Kept regardless of outcome: on a failure this is what shows why.
      - name: Keep the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-build-${{ github.run_number }}
          path: |
            App/build/export
            App/ExportOptions.plist
          if-no-files-found: ignore
          retention-days: 14
