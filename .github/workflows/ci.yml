name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  SWIFT_VERSION: "6.1.3"

jobs:
  kit:
    name: SmoooothKit (build + tests + purity)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Cache Swift toolchain
        id: cache-swift
        uses: actions/cache@v4
        with:
          path: ~/toolchains/swift-${{ env.SWIFT_VERSION }}
          key: swift-${{ env.SWIFT_VERSION }}-ubuntu2404
      - name: Install Swift toolchain
        if: steps.cache-swift.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/toolchains
          curl -sL "https://download.swift.org/swift-${SWIFT_VERSION}-release/ubuntu2404/swift-${SWIFT_VERSION}-RELEASE/swift-${SWIFT_VERSION}-RELEASE-ubuntu24.04.tar.gz" \
            | tar -xz -C ~/toolchains
          mv ~/toolchains/swift-${SWIFT_VERSION}-RELEASE-ubuntu24.04 ~/toolchains/swift-${SWIFT_VERSION}
      - name: Kit purity check (no Apple-only imports)
        run: tools/kit-purity-check.sh
      - name: Build and test
        run: |
          export PATH=$HOME/toolchains/swift-${SWIFT_VERSION}/usr/bin:$PATH
          cd SmoooothKit && swift build && swift test
      - name: iOS syntax gate
        run: |
          export PATH=$HOME/toolchains/swift-${SWIFT_VERSION}/usr/bin:$PATH
          tools/ios-syntax-check.sh

  db:
    name: Database (pgTAP schema + RLS)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start database
        run: supabase start -x studio,imgproxy,mailpit,logflare,vector,postgres-meta,edge-runtime,realtime
      - name: Run pgTAP tests
        run: supabase test db

  edge:
    name: Edge functions (deno test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Test
        run: |
          if compgen -G "supabase/functions/**/*.ts" >/dev/null 2>&1; then
            cd supabase/functions && deno test --allow-read=../../fixtures,../../configs
          else
            echo "no edge functions yet — skipping"
          fi

  xval:
    name: Swift ≡ TypeScript cross-validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Cross-validate golden vectors
        run: tools/xval.sh
