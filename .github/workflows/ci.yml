name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  SWIFT_VERSION: "6.1.3"

jobs:
  kit:
    name: SmoooothKit (build + tests + purity)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Cache Swift toolchain
        id: cache-swift
        uses: actions/cache@v4
        with:
          path: ~/toolchains/swift-${{ env.SWIFT_VERSION }}
          key: swift-${{ env.SWIFT_VERSION }}-ubuntu2404
      - name: Install Swift toolchain
        if: steps.cache-swift.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/toolchains
          curl -sL "https://download.swift.org/swift-${SWIFT_VERSION}-release/ubuntu2404/swift-${SWIFT_VERSION}-RELEASE/swift-${SWIFT_VERSION}-RELEASE-ubuntu24.04.tar.gz" \
            | tar -xz -C ~/toolchains
          mv ~/toolchains/swift-${SWIFT_VERSION}-RELEASE-ubuntu24.04 ~/toolchains/swift-${SWIFT_VERSION}
      - name: Kit purity check (no Apple-only imports)
        run: tools/kit-purity-check.sh
      - name: Build and test
        run: |
          export PATH=$HOME/toolchains/swift-${SWIFT_VERSION}/usr/bin:$PATH
          cd SmoooothKit && swift build && swift test
      - name: iOS syntax gate
        run: |
          export PATH=$HOME/toolchains/swift-${SWIFT_VERSION}/usr/bin:$PATH
          tools/ios-syntax-check.sh

  db:
    name: Database (pgTAP schema + RLS)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start database
        run: supabase start -x studio,imgproxy,mailpit,logflare,vector,postgres-meta,edge-runtime,realtime
      - name: Run pgTAP tests
        run: supabase test db

  e2e:
    name: End-to-end (live stack)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # PostgREST and Storage are both required here and both excluded from
      # the `db` job's list — the e2e tests upload blobs and talk to REST.
      # edge-runtime is still excluded: these tests import the handlers
      # directly rather than going over HTTP to a deployed function.
      - name: Start stack
        run: supabase start -x studio,imgproxy,mailpit,logflare,vector,postgres-meta,edge-runtime,realtime
      # The preflight is the point of this job as much as the tests are.
      # Every e2e test skips itself when the stack is down, so without it a
      # broken runner would report "0 passed" and pass.
      - name: Run end-to-end suite
        run: make e2e-test

  edge:
    name: Edge functions (deno test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Test
        run: cd supabase/functions && deno test --allow-read=../../fixtures,../../configs

  xval:
    name: Swift ≡ TypeScript cross-validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Cache Swift toolchain
        id: cache-swift
        uses: actions/cache@v4
        with:
          path: ~/toolchains/swift-${{ env.SWIFT_VERSION }}
          key: swift-${{ env.SWIFT_VERSION }}-ubuntu2404
      - name: Install Swift toolchain
        if: steps.cache-swift.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/toolchains
          curl -sL "https://download.swift.org/swift-${SWIFT_VERSION}-release/ubuntu2404/swift-${SWIFT_VERSION}-RELEASE/swift-${SWIFT_VERSION}-RELEASE-ubuntu24.04.tar.gz" \
            | tar -xz -C ~/toolchains
          mv ~/toolchains/swift-${SWIFT_VERSION}-RELEASE-ubuntu24.04 ~/toolchains/swift-${SWIFT_VERSION}
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Cross-validate golden vectors
        run: |
          export PATH=$HOME/toolchains/swift-${SWIFT_VERSION}/usr/bin:$PATH
          tools/xval.sh
