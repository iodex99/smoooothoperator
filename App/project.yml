# XcodeGen manifest — the entire iOS project definition lives in this file.
# On a Mac: `brew install xcodegen && xcodegen generate` (the .xcodeproj is
# gitignored). Authored on Linux; see docs/IOS-NOTES.md for the first-Mac
# session checklist.
name: SmoooothOperator

options:
  bundleIdPrefix: app.smooooth
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "16.0"

packages:
  SmoooothKit:
    path: ../SmoooothKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1"        # iPhone only in V1
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0

targets:
  SmoooothOperator:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: SmoooothKit
        product: SmoooothKit
    entitlements:
      path: Configs/SmoooothOperator.entitlements
    configFiles:
      Debug: Configs/Supabase.xcconfig
      Release: Configs/Supabase.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.smooooth.operator
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark   # dark mode is the primary experience (spec §12)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Configs/Info.plist
      properties:
        # Home screen truncates ~12 chars — "Smooooth" stays whole.
        CFBundleDisplayName: Smooooth
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        # OAuth callback for provider sign-in (Google). Must match the
        # redirect allow-list in the Supabase dashboard.
        CFBundleURLTypes:
          - CFBundleURLName: app.smooooth.operator.auth
            CFBundleURLSchemes:
              - smooothoperator
        # Injected from Configs/Supabase.xcconfig (gitignored). Absent in a
        # dev build → the app runs fully offline instead of crashing.
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
        # Background location is used ONLY during an active challenge run.
        UIBackgroundModes:
          - location
        NSLocationWhenInUseUsageDescription: >-
          Smooooth Operator uses your location during a challenge to verify
          your run on the course and score your drive. Location is never
          tracked outside an active challenge.
        NSMotionUsageDescription: >-
          Motion sensors measure how smoothly you accelerate, brake and corner
          during a challenge. This is the core of your driving score.

schemes:
  SmoooothOperator:
    build:
      targets:
        SmoooothOperator: all
    run:
      config: Debug
      storeKitConfiguration: Configs/Products.storekit
    test:
      config: Debug
    archive:
      config: Release
